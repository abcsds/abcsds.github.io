name: Deploy Jekyll site to Pages

# Requires GitHub Pages source set to "GitHub Actions" (Settings > Pages).
# Needed because jekyll-polyglot (multi-language support) isn't in GitHub
# Pages' native-build plugin whitelist.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # _data/cv.json is derived from _config.yml + _pages/cv.md + the
      # collections. Regenerating it here means the JSON CV at /cv-json/ can
      # never drift from the Markdown CV at /cv/, however the commit was made.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate CV JSON
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/cv_markdown_to_json.py \
            --input _pages/cv.md \
            --output _data/cv.json \
            --config _config.yml

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
